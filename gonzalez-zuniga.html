<style>
/* Layout: cabecera con datos del alumno, pestañas por parte de la unidad; columna de trabajo + soneto fijo al lado (arriba y plegable en el teléfono). */

}
@media (prefers-color-scheme: dark) {

    --grana: #E46A80; --grana-soft: #3A1F27; --ok: #6CC290; --ok-soft: #1C3327; --bad: #E78C73; --bad-soft: #3B251F; --syl-a: #3A1F27; --syl-b: #22293A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  --grana: #E46A80; --grana-soft: #3A1F27; --ok: #6CC290; --ok-soft: #1C3327; --bad: #E78C73; --bad-soft: #3B251F; --syl-a: #3A1F27; --syl-b: #22293A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

:focus-visible { outline: 2px solid var(--grana); outline-offset: 2px; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn { font: inherit; font-weight: 600; font-size: 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 8px 16px; cursor: pointer; }
button.btn:hover { opacity: .88; }

.fb p { margin: 0 0 6px; } .fb p:last-child { margin: 0; }

.rhyme { display: grid; grid-template-columns: 24px minmax(0, 1fr) 64px 20px; gap: 6px 10px; align-items: center; font-family: var(--f-read); }

.mk.y { color: var(--ok); } .mk.n { color: var(--bad); }

.pick .tok-nota { background: var(--line); }
.leyenda { margin: 0; font-size: 15px; color: var(--muted); }

.notes { display: flex; flex-direction: column; gap: 10px; }
.note label { font-weight: 600; font-size: 16px; display: block; margin-bottom: 4px; }
.note label span { color: var(--muted); font-weight: 400; }

.opt .def { font-family: var(--f-read); }
.dict { display: flex; flex-direction: column; gap: 14px; }
.dict-item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; }
.dict-item h4 { grid-column: 1 / -1; margin: 0; font-family: var(--f-read); font-size: 18px; font-weight: 600; }

.dict-item label { font-size: 14px; color: var(--muted); font-weight: 500; display: flex; flex-direction: column; gap: 3px; }

@media (max-width: 560px) { .dict-item { grid-template-columns: minmax(0, 1fr); } }
a { color: var(--grana); }

.poema-nota { font-size: 14px; color: var(--muted); margin: 0 0 8px; font-style: italic; }

  <div class="wrap">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="byline" id="byline"></p>
      <p class="course" id="course"></p>

    <div class="student">

    </div>
  </div>

  <div class="wrap">

      <details class="poem-card" id="poemCard">
        <summary>El poema</summary>
        <div class="poem-body" id="poemBody"></div>
      </details>
    </aside>
  </div>
</main>

<script>
/* ================================================================
   UNIDAD DIDÁCTICA: Ana María González y Zúñiga, dedicatoria del
   Florido ramo (1748) a la Virgen de Guadalupe.
   Los términos que ya explica la edición van en «notas»
   y no se preguntan en Vocabulario.
   ================================================================ */
const UNIDAD = {

  poema: [
    ["A ti hermosa Raquel, Sara divina,", "llega humillado mi confuso numen,", "si remontado a impulsos de su afecto", "puede subir a la florida cumbre."],
    ["Tú, prudente Abigaíl, eleva el vuelo", "de mi atrevida pluma, que no pude", "contener el orgullo de su empresa", "con el despeño cruel que le propuse."],
    ["Recibe de una humilde esclava tuya", "lo que el alma en deseos, Señora, encubre,", "aunque bien sé que obsequios tan indignos", "al humo del aroma se destruyen."],
    ["Pero llegando a tan excelsas aras,", "la menor oblación consigue lustre,", "que se elevan a trono majestuoso", "sacrificios que humildes se conducen."],
    ["Si acaso por indigna aquesta ofrenda", "se halla incapaz de que tu agrado ocupe,", "rendimientos angélicos son cortos", "para el divino ser de tus virtudes."],
    ["Esta pequeña empresa que tan sólo", "a una silvestre flor amor reduce,", "en el jardín florido de tu imagen,", "sea el riego de tu gracia quien la ilustre."],
    ["Tributo humildemente a tu hermosura", "de todos tus esclavos gratitudes,", "siendo yo para el tierno sacrificio", "la sierva que ministra los perfumes."],
    ["No desprecies, Señora, aquesta ofrenda", "porque va por mi mano, que, aunque inútil,", "no desmerece, que jamás el vaso", "al licor soberano quita el lustre."],
    ["A tus divinas plantas, Pensil sacro,", "es justo que una esclava te tribute,", "para el cuadro divino de tu imagen,", "flor que tu riego fecundó en mi numen."]

        <h3>La autora</h3>
        <p>Ana María González y Zúñiga escribió en la Ciudad de México durante la primera mitad del siglo <span style="font-variant:small-caps">xviii</span>. Como María Estrada de Medinilla, <strong>no era monja</strong>: según el bibliógrafo José Mariano Beristáin, estaba casada noblemente y tuvo un hijo sacerdote y una hija religiosa capuchina. Era aficionada a la lectura y, con un ingenio que Beristáin llama «agudo, pronto y naturalmente poético», se atrevió a competir con los mejores poetas de la ciudad en los certámenes públicos, en los que ganó varios premios.</p>
        <p>Las primeras noticias de ella aparecen en un certamen dedicado a san Juan de la Cruz (<i>El segundo quince de enero…</i>, 1730). Después participó en dos justas poéticas por la llegada al trono de Fernando VI, que se convocaron e imprimieron en 1748. La historiadora Josefina Muriel sospechaba que había escrito más de lo que conocemos, y las noticias de Beristáin le dan la razón: queda mucho por investigar sobre ella.</p>
        <h3>Las crónicas festivas</h3>
        <p>En la Nueva España, las fiestas públicas (la jura de un rey, la llegada de un virrey, una celebración religiosa) debían quedar en la memoria: había que narrarlas y describirlas, muchas veces en verso. Así surgió la <strong>crónica festiva</strong>, un género que relataba procesiones, calles adornadas, arcos triunfales y misas. Por regla, se escribía por encargo.</p>
        <p>En 1747 se celebró el nombramiento de la Virgen de Guadalupe como patrona de la América septentrional, es decir, de todo el territorio novohispano, y la crónica se le encargó a Ana María González y Zúñiga: el <i>Florido ramo</i> (1748). Es un dato notable, pues muestra que era admirada como poeta. Se conservan además otras dos crónicas festivas suyas, casi sin estudiar: <i>Enjugado llanto de Melpómene en la solemne jura del señor don Fernando VI</i> y <i>Resucitadas glorias de la hermosa Calíope en las festivas celebridades del deseado monarca Fernando VI</i> (ambas de 1750).</p>

        <h3>El poema</h3>
        <p>El poema que vamos a analizar es la <strong>dedicatoria</strong> con que se abre el <i>Florido ramo</i>, dirigida a la propia Virgen de Guadalupe. En una dedicatoria, quien escribe ofrece su obra a alguien más alto y, para hacerlo, se presenta a sí misma con mucha humildad. Fíjate en cómo la autora habla de sí misma y de su ofrenda.</p>
        <p>Recuerda también la tradición guadalupana: en 1531 la Virgen se apareció al indio Juan Diego en el Tepeyac. Como señal para el obispo, Juan Diego llevó en su tilma unas rosas cortadas en pleno invierno y, al desplegarla, apareció en ella la imagen de la Virgen. Por eso, en este poema, la imagen de Guadalupe se relaciona con flores y jardines.</p>
        <p>Las notas debajo del poema explican las palabras y referencias difíciles a partir de la edición de Tenorio.</p>

        { id: "m2b", tipo: "opcion", enunciado: "En uno de estos versos hay otra palabra que, para que el verso tenga once sílabas, debe leerse con sinéresis. ¿En cuál?",
          opciones: ["Tú, prudente Abigaíl, eleva el vuelo", "Pero llegando a tan excelsas aras,", "rendimientos angélicos son cortos", "siendo yo para el tierno sacrificio", "que se elevan a trono majestuoso"], correcta: 0,
          porque: [null,
            "Pe-ro-lle-gan-do‿a-tan-ex-cel-sas-a-ras: 11 sílabas sin ninguna licencia. Solo hay una sinalefa.",
            "ren-di-mien-tos‿an-gé-li-cos-son-cor-tos: 11 sílabas. «Mien» es un diptongo normal, no una sinéresis: en español siempre se pronuncia en una sílaba.",
            "sien-do-yo-pa-ra‿el-tier-no-sa-cri-fi-cio: 11 sílabas. «Sien», «tier» y «cio» son diptongos normales, no sinéresis.",
            "que-se‿e-le-van-a-tro-no-ma-jes-tuo-so: 11 sílabas. En «majestuoso», «tuo» es un diptongo: una u átona junto a otra vocal forma normalmente una sola sílaba. No hace falta ninguna licencia."],
          explicacion: "Es el verso 5. «Abigaíl» normalmente tiene cuatro sílabas, A-bi-ga-íl: la tilde de la í marca que la a y la í van separadas. Si se cuenta así, el verso tiene doce sílabas. Hay que leer «-gaíl» en una sola sílaba (sinéresis): Tú-pru-den-te‿A-bi-gaíl-e-le-va‿el-vue-lo, 11 sílabas." },
        { id: "m3", tipo: "opcion", enunciado: "Con lo que contaste, ¿qué medida tienen los versos?",
          opciones: ["Endecasílabos (arte mayor)", "Octosílabos (arte menor)", "Alejandrinos (catorce sílabas)", "Versos de medida variable"], correcta: 0,
          porque: [null, "Los octosílabos tienen 8 sílabas; los versos 1 y 10 tienen 11.", "Los alejandrinos tienen 14 sílabas y se dividen en dos mitades; estos tienen 11.", "Todos los versos que contaste tienen la misma medida: 11 sílabas."],
          explicacion: "Son endecasílabos, el verso de arte mayor más usado en la poesía culta desde el Renacimiento." },
        { id: "m4", tipo: "opcion", enunciado: "Observa cómo terminan los versos pares: «numen», «cumbre», «pude», «propuse», «encubre», «destruyen»… ¿Qué tienen en común?",
          opciones: ["Coinciden solo las vocales desde la última vocal tónica: u-e (rima asonante)", "Coinciden vocales y consonantes (rima consonante)", "No tienen nada en común", "Riman de dos en dos, con rimas distintas"], correcta: 0,
          porque: [null, "Compara «numen» y «cumbre»: las consonantes son distintas (-men / -mbre). Solo coinciden las vocales.", "Fíjate en las vocales desde la sílaba acentuada: n-ú-m-e-n, c-ú-m-b-r-e, p-ú-d-e.", "Todos terminan en u-e: es la misma rima a lo largo del poema."],
          explicacion: "Todos los versos pares tienen rima asonante en u-e: núm-e-n, cúmbr-e, púd-e, propús-e, encúbr-e, destrúy-e-n. La misma asonancia se mantiene a lo largo del poema, con una sola excepción que verás enseguida." },
        { id: "m4b", tipo: "opcion", enunciado: "Hay un solo verso par que rompe con la rima que acabamos de ver. ¿Cuál es?",
          opciones: ["El verso 30: «inútil»", "El verso 12: «destruyen»", "El verso 24: «ilustre»", "El verso 26: «gratitudes»"], correcta: 0,
          porque: [null, "Fíjate solo en las vocales desde la sílaba acentuada: destrúy-e-n. La n final no cuenta: es u-e.", "Ilústr-e: la vocal tónica es u y la final es e. Rima en u-e.", "Gratitúd-e-s: aunque la palabra es larga, desde la vocal tónica las vocales son u-e."],
          explicacion: "«Inútil» (v. 30) termina en ú-i, no en u-e: es una anomalía en la rima del romance. La tradición la toleraba porque una i átona al final de palabra suena muy cerca de una e, como en «Venus» o «cáliz», pero sigue siendo una rima imperfecta: el único verso par que se aparta de la asonancia." },
        { id: "m5", tipo: "opcion", enunciado: "¿Y los versos impares: «divina», «afecto», «vuelo», «empresa», «tuya», «indignos»…?",
          opciones: ["Quedan sueltos: no riman", "Riman todos en i-a", "Riman con los versos pares", "Riman en consonante entre ellos"], correcta: 0,
          porque: [null, "«Divina» termina en i-a, pero «afecto» en e-o y «vuelo» en u-e-o: no comparten vocales.", "Los pares terminan en u-e; «divina», «afecto» o «empresa» no.", "Compara «afecto» y «vuelo»: no coinciden ni las vocales."],
          explicacion: "Los versos impares quedan sueltos, sin rima. Solo riman los pares, siempre con la misma asonancia." },
        { id: "m6", tipo: "opcion", enunciado: "Con todos estos datos, ¿qué forma métrica usa la autora?",
          opciones: ["Un romance endecasílabo (o romance heroico)", "Una serie de cuartetos", "Una serie de serventesios", "Una silva"], correcta: 0,
          porque: [null, "El cuarteto tiene rima consonante ABBA. Aquí la rima es asonante y solo en los pares.", "El serventesio tiene rima consonante ABAB. Aquí los impares no riman.", "La silva combina libremente endecasílabos y heptasílabos; aquí todos los versos tienen 11 sílabas."],
          explicacion: "Es un romance: una serie de versos con la misma rima asonante en los pares y los impares sueltos. El romance tradicional es octosílabo, pero aquí los versos son endecasílabos: por eso se llama romance endecasílabo o romance heroico, una forma muy cultivada en los siglos XVII y XVIII. Aunque la edición lo presenta en grupos de cuatro versos, la rima corre igual a lo largo de todo el poema." }

        { id: "l1b", tipo: "opcion", versos: [1], enunciado: "Fíjate en el verso 1: la autora le habla en singular a alguien («a ti»), pero le da dos nombres, «hermosa Raquel» y «Sara divina». ¿Cómo puede ser una sola persona con dos nombres? Que la llame «divina» es una pista: no se trata de Sara en sentido estricto. ¿A quién le habla?",

            texto: "<p>En la época se leía el Antiguo Testamento como un anuncio del Nuevo: sus personajes y escenas eran «figuras» de lo que vendría después. En la Sevilla de principios del siglo <span style=\"font-variant:small-caps\">xviii</span>, por ejemplo, el capuchino fray Isidoro de Sevilla invocaba a la Virgen como «¡Oh Raquel Divina!».</p><p>La escena que pintó Rubens viene de 1 Samuel 25. Nabal, un hombre rico y cruel, se negó a dar provisiones a David y a sus hombres, y David decidió vengarse. Su esposa, la prudente Abigaíl, salió a su encuentro con pan, vino y otros alimentos, se arrodilló ante él, se llamó a sí misma «tu sierva» y le pidió clemencia. David se apaciguó. Desde la Edad Media, esta escena se leía como figura de María, que intercede ante Dios por los pecadores: así aparece en el <i>Speculum humanae salvationis</i>, un manual muy difundido que emparejaba escenas del Antiguo y del Nuevo Testamento.</p><p>Fíjate en que Abigaíl se presenta como «sierva» y lleva una ofrenda: es lo mismo que hará la autora en este poema.</p>"

        { id: "v1", tipo: "acepcion", requiere: "l0", forma: "numen", verso: 2, lema: "NUMEN", modo: "elegir",
          opciones: ["Lo mismo que Deidad. Llamaban assí los Gentiles a qualquiera de los Dioses fabulosos que adoraban.", "Se toma tambien por el ingénio, o génio especial en alguna facultad o arte, como atribuyéndole a Deidad que le inspíra. Regularmente se toma por el númen poético."], correcta: 1,
          porque: ["Es el sentido original: un dios pagano. Aquí no habla de ningún dios, sino de algo suyo: «mi confuso numen».", null],
          explicacion: "El numen es el ingenio poético, la inspiración, como si un dios la soplara. La autora habla de su propia capacidad de escribir, que llega «confusa» y «humillada» ante la Virgen. La palabra vuelve en el último verso: el poema empieza y termina con su numen." },

          opciones: ["Subir o volar mui altas las aves.", "Vale tambien encumbrarse, elevarse o sublimarse.", "(REMONTAR) Ahuyentar o espantar alguna cosa. Dícese propriamente de la caza, que acosada y perseguida se retira a lo oculto y montuoso."], correcta: 1,
          porque: ["Es el sentido literal, el de las aves. El numen no es un ave, aunque la imagen del vuelo está presente: la autora la desarrolla en la estrofa siguiente con «el vuelo / de mi atrevida pluma». Aquí se usa en sentido figurado.", null, "Este sentido viene de la caza. Aquí nadie ahuyenta al numen: él mismo sube hacia la cumbre."],
          explicacion: "«Remontado» es 'elevado, encumbrado': el numen solo puede subir a la cumbre si lo eleva el impulso de su afecto. La imagen del vuelo continúa en la estrofa siguiente." },
        { id: "l2", tipo: "abierta", versos: [1, 2, 3, 4], enunciado: "Pon en prosa los versos 1 a 4.",
          ideas: [
            { ok: "Pusiste el sujeto, «mi confuso numen», junto a su verbo, «llega».", falta: "¿Qué llega? Empieza por el sujeto y colócalo junto a «llega».", claves: ["mi confuso numen llega", "mi numen confuso llega", "mi confuso numen humillado llega", "mi confuso numen, humillado, llega", "llega mi confuso numen"] },
            { ok: "Mantuviste la condición: «si… puede subir a la florida cumbre».", falta: "No olvides la condición que empieza con «si»: ¿qué puede hacer el numen si lo eleva su afecto?", claves: ["si remontado", "si, remontado", "si puede subir", "si su afecto", "si a impulsos", "si, a impulsos"] },
            { conserva: ["hermosa", "Raquel", "Sara", "divina", "llega", "humillado", "confuso", "numen", "remontado", "impulsos", "afecto", "puede", "subir", "florida", "cumbre"] }
          ],
          propuesta: "Mi confuso numen llega humillado a ti, hermosa Raquel, divina Sara, si, remontado a impulsos de su afecto, puede subir a la florida cumbre.<br><br>También es válido: «Mi confuso numen llega humillado a ti, hermosa Raquel, divina Sara, si puede subir a la florida cumbre remontado a impulsos de su afecto»." },
        { id: "v9", tipo: "acepcion", requiere: "l0", forma: "empresa", verso: 7, lema: "EMPRESA (Autoridades la registra como EMPRESSA)", modo: "elegir",
          enunciado: "«empresa» (vv. 7 y 21). Busca: <b>EMPRESSA</b>, con doble s, como la escribía la Academia.",
          opciones: ["Cierto symbolo o figura enigmática, con un mote breve y conciso, enderezado a manifestar lo que el ánimo quiere o pretende.", "Vale tambien la acción y determinación de emprender algún negocio árduo y considerable, y el esfuerzo, valor y acometimiento con que se procúra lograr el intento."], correcta: 1,
          porque: ["Es la empresa de los libros de emblemas: una figura con un lema. Aquí se habla de algo que la pluma se atreve a hacer («el orgullo de su empresa») y de la obra que la autora ofrece («esta pequeña empresa»).", null],
          explicacion: "La empresa es una acción ardua que alguien se atreve a emprender, con esfuerzo y valor. La pluma de la autora se lanza a una empresa demasiado alta, escribir a la Virgen (v. 7), y luego llama a su obra «esta pequeña empresa» (v. 21): la acción es atrevida, pero el resultado es humilde." },
        { id: "v3", tipo: "acepcion", requiere: "l0", forma: "despeño", verso: 8, lema: "DESPEÑO", modo: "elegir",
          opciones: ["s. m. Caída precipitada. Fórmase del nombre Peña, por alusión al que cae rodando de las peñas abaxo.", "Metaphoricamente se toma por la ruina que alguno padece en el espíritu, honra o fama.", "Vale tambien lo mismo que Desconcierto, fluxo de vientre o diarrhea."], correcta: 0,
          porque: [null, "Se acerca, pero la autora sigue con la imagen del vuelo: la pluma que sube demasiado alto puede caer de golpe. El despeño es esa caída, no una ruina moral.", "Es un sentido médico que no tiene nada que ver con el vuelo de la pluma."],
          explicacion: "El despeño es la caída precipitada, como la del que rueda desde una peña. La autora le advirtió a su pluma que podía caer, como Ícaro, si volaba tan alto; aun así, no pudo contener su atrevimiento." },
        { id: "l3", tipo: "opcion", versos: [5, 6, 7, 8], enunciado: "En «el orgullo de su empresa» (v. 7) y «el despeño cruel que le propuse» (v. 8), ¿a quién se refieren «su» y «le»?",
          opciones: ["A «mi atrevida pluma»", "A Abigaíl", "Al vuelo", "Al orgullo"], correcta: 0,
          porque: [null, "A Abigaíl, es decir, a la Virgen, la autora le pide ayuda («eleva el vuelo»), pero no es ella quien se atreve a subir.", "El vuelo es de la pluma: «el vuelo / de mi atrevida pluma». Quien emprende y quien puede caer es la pluma.", "El orgullo es de la empresa; no puede tener a su vez una empresa."],
          explicacion: "Los dos se refieren a la pluma, que es «atrevida»: la autora no pudo contener el orgullo de la empresa de su pluma, aunque le propuso, como advertencia, una cruel caída. Por eso le pide a la Virgen, a quien llama aquí «prudente Abigaíl», que eleve su vuelo: sola, su pluma no podría llegar tan alto." },
        { id: "l3b", tipo: "opcion", versos: [9, 10, 11, 12], enunciado: "En las dos primeras estrofas, la autora llama a la Virgen con nombres de heroínas bíblicas. En el verso 10 la llama de otra manera: «Señora». ¿A quién se refiere?",
          opciones: ["A la Virgen de Guadalupe", "A una dama noble que protegía a la autora", "A la Iglesia", "A la propia autora"], correcta: 0,
          porque: [null, "Nada en el poema habla de una protectora humana: la «Señora» tiene «excelsas aras», un «trono majestuoso» y una «imagen» en un jardín florido.", "La Iglesia aparece como figura en otros poemas, como el de la oliva de Estrada de Medinilla, pero aquí la «Señora» tiene una «imagen» y es «Pensil sacro»: es la Virgen.", "La autora se llama a sí misma «humilde esclava tuya»: la Señora es aquella a quien sirve."],
          explicacion: "«Señora» es la Virgen, Nuestra Señora de Guadalupe, a quien está dedicado el Florido ramo. Es la misma a quien la autora llamó «hermosa Raquel», «Sara divina» y «prudente Abigaíl»: ahora deja las figuras bíblicas y la nombra directamente, con el título que le corresponde. Ante ella se presenta como «humilde esclava», igual que Abigaíl se presentó como «sierva» ante David." },
        { id: "v4", tipo: "acepcion", requiere: "l0", forma: "oblación", verso: 14, lema: "OBLACIÓN", modo: "interpretar",
          enunciado: "«oblación» (v. 14). Busca: <b>OBLACIÓN</b>. Tomando en cuenta la definición que encontraste, ¿cuál podría ser un sinónimo en español moderno?",
          intro: "Elige el sinónimo:",
          opciones: ["ofrenda", "oración", "obligación", "ablución"], correcta: 0,
          porque: [null, "Suena parecido, pero la oblación no son palabras dirigidas a Dios: es algo que se le entrega.", "Suena parecido, pero Autoridades no habla de un deber: la oblación es algo que se ofrece a Dios.", "La ablución es el lavado ritual, no lo que se pone sobre el altar."],
          explicacion: "La oblación es una ofrenda sagrada, como las que se ponían sobre las «aras», es decir, los altares (v. 13). La autora presenta su poema como una ofrenda en un altar." },
        { id: "l5", tipo: "opcion", versos: [17, 18], enunciado: "«Aquesta» es una forma antigua de «esta». Ahora bien, en «se halla incapaz de que tu agrado ocupe» (v. 18), ¿cuál es el sujeto de «ocupe»?",
          opciones: ["«aquesta ofrenda», sobreentendida", "«tu agrado»", "un «yo» implícito", "«rendimientos angélicos»"], correcta: 0,
          porque: [null, "Parece el sujeto porque está antes del verbo, pero es lo que la ofrenda podría ocupar: el complemento directo.", "La autora habla de la ofrenda, no de sí misma: la ofrenda es la que se halla incapaz.", "Los «rendimientos angélicos» aparecen en otra oración, en el verso 19."],
          explicacion: "El sujeto es la ofrenda, que no se repite: la ofrenda se halla incapaz de ocupar tu agrado, es decir, de ganarse tu gusto. «Tu agrado» es el complemento directo, colocado antes del verbo por hipérbaton. Los versos 19-20 consuelan a la autora: hasta los homenajes de los ángeles se quedan cortos ante las virtudes de la Virgen." },
        { id: "v5", tipo: "acepcion", requiere: "l0", forma: "rendimientos", verso: 19, lema: "RENDIMIENTO", modo: "interpretar",
          enunciado: "«rendimientos» (v. 19). Busca: <b>RENDIMIENTO</b>. Tomando en cuenta la definición que encontraste, ¿cuál podría ser un sinónimo en español moderno?",
          intro: "Elige el sinónimo:",
          opciones: ["homenajes", "ganancias", "cansancios", "rendiciones"], correcta: 0,
          porque: [null, "Es el sentido económico, el más común hoy (el rendimiento de una inversión). Aquí no hay ganancias: se habla de lo que los ángeles ofrecen a la Virgen.", "Autoridades registra ese sentido (fatiga, cansancio), pero los ángeles no están cansados: lo que se queda «corto» es lo que le ofrecen.", "Se acerca a otra acepción (la entrega de algo en manos de otro, como una plaza que se rinde), pero aquí no hay batalla: es la sumisión respetuosa con que se sirve y complace a alguien."],
          explicacion: "Los «rendimientos angélicos» son los homenajes de sumisión que los ángeles rinden a la Virgen para servirla y complacerla. Si hasta esos son cortos, la pobre ofrenda de la autora tiene disculpa." },
        { id: "l6", tipo: "opcion", versos: [21, 22, 23, 24], enunciado: "En «Esta pequeña empresa que tan sólo / a una silvestre flor amor reduce» (vv. 21-22), ¿cuál es el sujeto de «reduce»?",
          opciones: ["amor", "esta pequeña empresa", "una silvestre flor", "el riego de tu gracia"], correcta: 0,
          porque: [null, "«Esta pequeña empresa» es el antecedente del «que»: es lo que se reduce, el complemento directo.", "«A una silvestre flor» lleva preposición: es aquello a lo que se reduce la empresa.", "«El riego de tu gracia» aparece en otra oración, la del verso 24."],
          explicacion: "El sujeto es «amor», colocado al final: el amor reduce esta pequeña empresa tan solo a una flor silvestre. Fíjate en que va sin artículo: en la lírica de los siglos XVI al XVIII era normal, porque el amor estaba personificado, como el dios Amor (Cupido), y funcionaba casi como un nombre propio. Luego la autora le pide a la Virgen que el riego de su gracia la ilustre, es decir, que la engrandezca: «la» se refiere a la empresa." },
        { id: "l6b", tipo: "ordenar", versos: [25, 26], enunciado: "Parece que «tributo» (v. 25) debemos leerlo como verbo conjugado («yo tributo»), no como sustantivo. Pero ¿qué hacemos con el hipérbaton? «Tributo humildemente a tu hermosura / de todos tus esclavos gratitudes». Mueve las palabras para que queden en un orden más natural.",
          palabras: ["Tributo", "humildemente", "a", "tu", "hermosura", "de", "todos", "tus", "esclavos", "gratitudes"],
          soluciones: [
            "Tributo humildemente a tu hermosura gratitudes de todos tus esclavos",
            "humildemente Tributo a tu hermosura gratitudes de todos tus esclavos",
            "Tributo a tu hermosura humildemente gratitudes de todos tus esclavos",
            "Tributo humildemente gratitudes de todos tus esclavos a tu hermosura",
            "humildemente Tributo gratitudes de todos tus esclavos a tu hermosura"
          ],
          errores: [
            { debe: "gratitudes de todos tus esclavos", porque: "¿De quién son las gratitudes? Coloca «de todos tus esclavos» justo después de «gratitudes»." },
            { debe: "a tu hermosura", porque: "Mantén juntas las palabras de «a tu hermosura»: es a quien se tributa." }
          ],
          generico: "Ya juntaste «gratitudes de todos tus esclavos». Ahora revisa dónde queda: lo que se tributa va después del verbo «tributo».",
          explicacion: "«Tributo» es un verbo: yo tributo. Lo que la autora tributa son «gratitudes de todos tus esclavos», y se las tributa «a tu hermosura». El orden natural es: «Tributo humildemente a tu hermosura gratitudes de todos tus esclavos» (o bien «Humildemente tributo a tu hermosura…»). Ella se presenta como portavoz de todos los esclavos de la Virgen." },
        { id: "v6", tipo: "acepcion", requiere: "l0", forma: "ministra", verso: 28, lema: "MINISTRAR", modo: "interpretar",
          enunciado: "«ministra» (v. 28). Busca: <b>MINISTRAR</b>. Tomando en cuenta la definición que encontraste, ¿cuál podría ser un sinónimo en español moderno?",
          intro: "Elige el sinónimo:",
          opciones: ["suministra", "administra", "oficia", "gobierna"], correcta: 0,
          porque: [null, "Suena parecido, pero la autora no dirige ni gestiona los perfumes: se los da en la mano a otro.", "Se acerca a otra acepción (servir o ejercer un oficio), pero aquí «ministrar» lleva complemento directo, «los perfumes»: no ejerce un oficio, sino que los da.", "Nada en el verso habla de mandar: ella es la «sierva»."],
          explicacion: "La autora es la sierva que da en la mano los perfumes para el sacrificio: no es la sacerdotisa, sino quien le alcanza lo necesario. Otra vez se pone en el lugar más humilde." },
        { id: "v10", tipo: "acepcion", requiere: "l0", forma: "desmerece", verso: 31, lema: "DESMERECER", modo: "interpretar",
          enunciado: "«desmerece» (v. 31). Busca: <b>DESMERECER</b>. Tomando en cuenta la definición que encontraste, ¿cuál podría ser un sinónimo en español moderno?",
          intro: "Elige el sinónimo:",
          opciones: ["pierde mérito", "desprecia", "se olvida", "disgusta"], correcta: 0,
          porque: [null, "Desmerecer no es despreciar a otro: es hacerse uno mismo indigno de premio o alabanza.", "La definición no habla de olvido, sino de volverse indigno de premio o alabanza.", "No se trata de causar disgusto, sino de perder el derecho a un premio o una alabanza."],
          explicacion: "Desmerecer es hacerse indigno de un premio o de una alabanza, no simplemente valer menos. La ofrenda, aunque va por una mano «inútil», no se vuelve indigna del favor de la Virgen." },
        { id: "l7", tipo: "opcion", versos: [29, 30, 31, 32], enunciado: "En los versos 30-31 hay dos «que». El primero («que, aunque inútil, no desmerece») se refiere a «mi mano». ¿Qué valor tiene el segundo («que jamás el vaso…», v. 31)?",
          opciones: ["Causal: equivale a «pues» o «porque»", "Relativo: se refiere también a «mi mano»", "Comparativo, como en «más… que»", "Introduce lo que dice alguien"], correcta: 0,
          porque: [null, "Después de este «que» viene una oración completa con su propio sujeto, «el vaso». No se refiere a la mano.", "No hay ningún «más» o «menos» antes: no compara.", "Nadie dice nada en estos versos: el «que» no depende de un verbo como «decir» o «saber»."],
          explicacion: "Es causal: equivale a «pues» o «porque». En español moderno aún lo usamos así, pero casi siempre después de un imperativo («Dame de comer, que tengo hambre»). Aquí: «no desmerece, pues jamás el vaso quita el lustre al licor soberano». La autora explica por qué su mano, aunque inútil, no le quita valor a su ofrenda." },
        { id: "v8", tipo: "acepcion", requiere: "l0", forma: "Pensil", verso: 33, lema: "PENSIL", modo: "interpretar",
          enunciado: "«Pensil» (v. 33). Busca: <b>PENSIL</b>. Tomando en cuenta la definición que encontraste, ¿cuál podría ser un sinónimo en español moderno?",
          intro: "Elige el sinónimo:",
          opciones: ["jardín", "pincel", "pensamiento", "santuario"], correcta: 0,
          porque: [null, "Suena casi igual, y en la estrofa se habla de un «cuadro» (v. 35), pero Autoridades define el pensil como un jardín.", "Se parece a «pensar», pero no tiene nada que ver: Autoridades lo define como un jardín.", "La Virgen es sagrada («sacro»), pero el pensil no es un templo, sino un jardín: así se prepara la imagen de la flor del último verso."],
          explicacion: "Un pensil es un jardín delicioso; originalmente, un jardín colgante como los de Babilonia. La Virgen es un «Pensil sacro», un jardín sagrado: la imagen recoge «el jardín florido de tu imagen» (v. 23) y prepara la flor del último verso." }
      ]
    },
    {
      id: "figurado", nombre: "Sentido figurado",
      titulo: "La ofrenda y el jardín",
      lead: "Lee el poema en su conjunto y explica qué significan sus imágenes. Cada pregunta tiene una respuesta modelo para que compares la tuya.",
      lectura: `<p>El poema es una ofrenda: la autora presenta su libro a la Virgen como un sacrificio en un altar y como una flor en un jardín. Relee el contexto y las notas antes de responder.</p>`,
      preguntas: [
        { id: "f0", tipo: "oposicion", versos: [9, 10, 11, 12], rango: [9, 16], enunciado: "La poesía barroca gusta de las oposiciones: une y enfrenta contrarios para crear tensión y sorpresa. En una dedicatoria, la oposición principal es entre la grandeza de quien recibe la ofrenda y la pequeñez de quien la ofrece. En estos versos ya resaltamos el lado de la grandeza: «Señora», «excelsas aras», «lustre», «se elevan a trono majestuoso». ¿Qué palabras quedan del lado opuesto, el de la pequeñez o poco valor? Márcalas.",
          dados: [{ v: 10, p: "Señora" }, { v: 13, p: "excelsas" }, { v: 13, p: "aras" }, { v: 14, p: "lustre" }, { v: 15, p: "elevan" }, { v: 15, p: "trono" }, { v: 15, p: "majestuoso" }],
          terminos: [
            { forma: "humilde", v: 9, palabras: ["humilde"] },
            { forma: "esclava", v: 9, palabras: ["esclava"] },
            { forma: "indignos", v: 11, palabras: ["indignos"] },
            { forma: "se destruyen", v: 12, palabras: ["se", "destruyen"] },
            { forma: "menor", v: 14, palabras: ["menor"] },
            { forma: "humildes", v: 16, palabras: ["humildes"] }
          ],
          admitidas: [{ v: 12, p: "humo" }, { v: 10, p: "encubre" }, { v: 14, p: "oblación" }, { v: 16, p: "sacrificios" }],
          pistaFalta: "Busca las palabras con que la autora se describe a sí misma y a su ofrenda, y lo que le pasa a esa ofrenda, en los versos 9, 11, 12, 14 y 16.",
          explicacion: "Del lado de la pequeñez o poco valor quedan la «humilde esclava», los obsequios «indignos», que «se destruyen» con el humo del aroma, «la menor oblación» y los sacrificios «humildes». La estrofa 4 da la vuelta a la oposición: precisamente por llegar a un altar tan alto, lo más pequeño «consigue lustre», y lo humilde «se eleva» al trono. La humildad no es un obstáculo, sino lo que permite subir." },
        { id: "f0b", tipo: "opcion", versos: [9, 10, 11, 12], enunciado: "La autora formula de manera vaga lo que le ofrenda a la Virgen: solo dice que le dará «lo que el alma en deseos, Señora, encubre» (v. 10). Parece que hay que entender que el alma encubre u oculta algo a través de sus deseos. Pero ¿qué podría ser?",
          opciones: ["Su propio amor por la Virgen", "Sus pecados, que prefiere no confesar", "Un secreto que no quiere revelar a nadie", "Las riquezas que piensa donar a su santuario"], correcta: 0,
          porque: [null,
            "No tendría sentido ofrecerle a la Virgen sus pecados como un obsequio. Lo que ofrece es algo que considera valioso, aunque lo llame «indigno».",
            "Si no quisiera revelarlo, no se lo ofrecería. Lo oculto no es un secreto, sino algo que solo se deja ver a través de los deseos.",
            "Nada en el poema habla de bienes materiales: la ofrenda sale del «alma»."],
          explicacion: "Lo que el alma encubre en sus deseos es su amor: los deseos son la forma visible de un amor que no puede mostrarse del todo. La ofrenda, entonces, no es solo el libro, sino el amor de la autora por la Virgen, que el poema apenas deja ver. El mismo poema lo confirma más adelante: es «amor» el que reduce su pequeña empresa a una flor silvestre (v. 22)." },
        { id: "f1", tipo: "abierta", versos: [1, 2, 3, 4, 5, 6, 7, 8], enunciado: "Ya sabes que la autora le habla a la Virgen desde el primer verso, pero la llama «hermosa Raquel», «Sara divina» y «prudente Abigaíl». Revisa las notas: ¿qué cualidades de María destaca con cada una de estas figuras? ¿Por qué Abigaíl es especialmente oportuna para lo que la autora le pide en el verso 5?",
          ideas: [
            { ok: "Ves que estas mujeres funcionan como figuras o prefiguraciones de María.", falta: "¿Qué relación hay entre esas mujeres del Antiguo Testamento y la Virgen? Recuerda lo que viste en la pregunta sobre el verso 1.", claves: ["prefigur*", "figura*", "anuncia*", "tipolog*", "antiguo testamento", "biblic*", "simboliz*", "represent*", "compara*", "como maria", "nombres de maria", "nombres de la virgen"] },
            { ok: "Mencionas la hermosura, que el poema subraya.", falta: "Fíjate en los adjetivos: «hermosa Raquel», «Sara divina». ¿Qué cualidad destacan?", claves: ["hermos*", "bell*", "belleza", "linda", "buen ver", "divina"] },
            { ok: "Mencionas la prudencia de Abigaíl.", falta: "¿Qué dice la nota de Abigaíl? «Prudente», «juiciosa»: ¿qué virtud de María destaca?", claves: ["prudent*", "juicio*", "sabia", "sabiduria", "inteligen*", "sensat*", "virtu*"] },
            { ok: "Relacionas a Abigaíl con la intercesión: la autora le pide a la Virgen que la ayude a elevar su pluma.", falta: "Abigaíl calmó el enojo de David con su súplica. ¿Qué le pide la autora a «Abigaíl» en el verso 5?", claves: ["interce*", "mediador*", "mediacion", "suplica*", "clemencia", "ayud*", "eleve", "eleva", "elevar", "vuelo", "pluma", "auxili*", "abogad*", "ofrenda*", "regalo*", "sierva"] }

          propuesta: "Las tres son figuras de María: mujeres del Antiguo Testamento que, según la lectura de la época, anunciaban a la Virgen. Con Raquel y Sara, famosas por su hermosura y madres del pueblo elegido, la autora destaca la belleza de María («hermosa», «divina»). Con Abigaíl, «mujer juiciosa y de buen ver», destaca su prudencia. Abigaíl es especialmente oportuna: se arrodilló ante David con una ofrenda, se llamó a sí misma su «sierva» y, con su súplica, calmó su enojo; por eso se leía como figura de María intercesora. La autora le pide a la Virgen, como a una nueva Abigaíl, que eleve el vuelo de su pluma: que interceda y la ayude a llegar hasta ella. Y la autora misma, como Abigaíl, se presentará como «esclava» que trae una ofrenda." },

<script>
/* ================== Motor de la unidad ================== */
const KEY = "poesia-nh:" + UNIDAD.id;
/* Dirección del programa de Google Apps Script que registra la entrega y envía el correo.
   Vacía = sin envío por correo (solo copiar y pegar en Classroom). */
const ENVIO_URL = "https://script.google.com/macros/s/AKfycbz8dqtzad4ixdcs4DVkKF_5JpuAGsbVMPSFRCYp3pGJ-VWFY5Ftb713__A-3B2dBiSY/exec";
const correoValido = c => /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test((c || "").trim());
const VERSOS = UNIDAD.poema.flat();
const QS = {};
UNIDAD.partes.forEach((p, pi) => p.preguntas.forEach((q, qi) => { q.parte = pi; q.n = qi + 1; QS[q.id] = q; }));
const N_PARTES = UNIDAD.partes.length; // la pestaña final de entrega es N_PARTES

let S = { nombre: "", correo: "", r: {}, sec: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function st(id) { return S.r[id] || (S.r[id] = {}); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function strip(h) { return String(h).replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " "); }
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function tokens(line) {
  return line.split(" ").map(t => { const m = t.match(/^([¡¿«"]*)(.*?)([.,;:!?…»"]*)$/); return { pre: m[1], w: m[2], post: m[3] }; });
}
const isDone = q => !!(S.r[q.id] && S.r[q.id].done);
/* una pregunta cuenta como respondida si se guardó o, en las que se corrigen solas, si se intentó al menos una vez */
const answered = q => { const s = S.r[q.id]; return !!s && (!!s.done || (["opcion", "numero", "rima", "silabas", "acentos", "acepcion", "corta", "oposicion", "ordenar"].includes(q.tipo) && s.intentos > 0)); };
const pendientes = i => UNIDAD.partes[i].preguntas.filter(q => !answered(q)).length;
const unlocked = i => { for (let k = 0; k < Math.min(i, N_PARTES); k++) if (pendientes(k)) return false; return true; };
const AUTO = ["opcion", "numero", "rima", "silabas", "acentos", "acepcion", "corta", "oposicion", "ordenar"];
/* ejercicio «oposicion»: marcar en q.rango los términos del lado contrario a q.dados */
const VACIAS = ["a", "al", "de", "del", "el", "la", "lo", "los", "las", "en", "que", "si", "no", "y", "todo"];
const esDado = (q, ln, w) => q.dados.some(d => d.v === ln && norm(d.p) === norm(w));
function oposicionRes(q, m) {
  const ks = Object.keys(m || {});
  const hit = t => ks.some(k => +k.split("-")[0] === t.v && t.palabras.some(p => norm(p) === norm(tokWord(k))));
  const enTermino = k => q.terminos.some(t => +k.split("-")[0] === t.v && t.palabras.some(p => norm(p) === norm(tokWord(k))))
    || (q.admitidas || []).some(d => d.v === +k.split("-")[0] && norm(d.p) === norm(tokWord(k)));
  return { found: q.terminos.filter(hit), missed: q.terminos.filter(t => !hit(t)), extra: sortKeys(ks.filter(k => !enTermino(k) && !VACIAS.includes(norm(tokWord(k))))) };
}
function ordText(q, o) { return (o || q.palabras.map((_, i) => i)).map(i => q.palabras[i]).join(" "); }
function sortKeys(ks) { return ks.slice().sort((a, b) => { const [la, wa] = a.split("-").map(Number), [lb, wb] = b.split("-").map(Number); return la - lb || wa - wb; }); }
function tokWord(k) { const [l, w] = k.split("-").map(Number); return tokens(VERSOS[l - 1])[w].w; }
/* qué términos de la unidad encontró el alumno y qué marcó de más */
function seleccionRes(q, m) {
  const ks = Object.keys(m || {});
  const hit = t => ks.filter(k => [t.v, ...(t.otros || [])].includes(+k.split("-")[0]) && t.palabras.some(p => norm(p) === norm(tokWord(k))));
  const used = new Set(), found = [], missed = [];
  q.terminos.forEach(t => { const h = hit(t); h.forEach(k => used.add(k)); (h.length ? found : missed).push(t); });
  return { found, missed, extra: sortKeys(ks.filter(k => !used.has(k))) };
}
const enNota = (ln, w) => (UNIDAD.notas || []).some(n => n.v === ln && norm(n.termino).split(/[^a-zñ]+/).includes(norm(w)));
function pickPoem(q, m, done) {
  let n = 0;
  return UNIDAD.poema.map(est => '<div class="stanza">' + est.map(v => {
    const ln = ++n;
    return tokens(v).map((t, wi) => {
      const k = ln + "-" + wi;
      if (q.tipo === "seleccion" && enNota(ln, t.w)) return `${esc(t.pre)}<span class="tok-nota" title="Ya la explica una nota de la edición">${esc(t.w)}</span>${esc(t.post)}`;
      return `${esc(t.pre)}<button class="tok ${k in m ? "on" : ""}" data-act="tok" data-q="${q.id}" data-k="${k}" aria-pressed="${k in m}" ${done ? "disabled" : ""}>${esc(t.w)}</button>${esc(t.post)}`;
    }).join(" ");

}
/* orden fijo pero distinto en cada pregunta, para que la correcta no quede siempre en el mismo lugar */
function orden(q) {
  let h = 0; for (const c of UNIDAD.id + q.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const ix = q.opciones.map((_, i) => i);
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  for (let i = ix.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ix[i], ix[j]] = [ix[j], ix[i]]; }
  return ix;
}
function simil(a, b) {
  const w = s => norm(s).replace(/[^a-zñ\s]/g, " ").split(/\s+/).filter(Boolean);
  const A = w(a), B = w(b); if (!A.length) return 0;
  const pool = A.slice(); let hits = 0;
  B.forEach(x => { const i = pool.indexOf(x); if (i >= 0) { hits++; pool.splice(i, 1); } });
  return A.length > B.length * 2 ? 0 : hits / B.length;

const isL = c => /\p{L}/u.test(c);
function firstL(v) { for (let i = 0; i < v.length; i++) if (isL(v[i])) return i; return 0; }
/* inicios de sílaba (índices de letra) a partir de la solución con barras */
function solB(q) { const out = []; let vi = 0, pend = false; for (const c of q.solucion) { if (c === "|") { pend = true; continue; } if (pend && isL(c)) { out.push(vi); pend = false; } vi++; } return out; }
function sylOf(v, B) {
  const syl = []; let n = 0; const f = firstL(v);
  for (let i = 0; i < v.length; i++) if (isL(v[i])) { if (i === f || B.has(i)) n++; syl[i] = n; }
  for (let i = 0; i < v.length; i++) if (!isL(v[i])) {
    let p = i - 1; while (p >= 0 && !isL(v[p])) p--;
    let x = i + 1; while (x < v.length && !isL(v[x])) x++;
    syl[i] = p >= 0 && x < v.length && syl[p] === syl[x] ? syl[p] : 0;
  }
  return { syl, n };
}
function divText(v, B) {
  const { syl } = sylOf(v, B); let out = "", prev = 0;
  for (let i = 0; i < v.length; i++) { const c = v[i];
    if (isL(c)) { if (prev && syl[i] !== prev) out += "-"; out += c; prev = syl[i]; }
    else if (c === " " && syl[i]) out += "‿"; }
  return out;
}

    const v = parseInt(document.getElementById("n-" + q.id).value, 10);
    if (!v) { s.msg = "Escribe un número."; return; }
    s.val = v; s.intentos = (s.intentos || 0) + 1; s.ok = v === q.correcta; s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "oposicion") {
    if (!Object.keys(s.marcadas || {}).length) { s.msg = "Marca al menos una palabra."; return; }
    const r = oposicionRes(q, s.marcadas);
    s.intentos = (s.intentos || 0) + 1; s.ok = !r.missed.length && !r.extra.length; s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "ordenar") {
    const o = s.orden || q.palabras.map((_, i) => i);
    if (o.every((x, i) => x === i)) { s.msg = "Mueve las palabras antes de comprobar."; return; }
    s.intentos = (s.intentos || 0) + 1; s.ok = q.soluciones.map(norm).includes(norm(ordText(q, o))); s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "corta") {
    const w = norm(s.texto || "").split(/[^a-zñ]+/).filter(Boolean);
    if (!w.length) { s.msg = "Escribe tu respuesta."; return; }
    s.intentos = (s.intentos || 0) + 1; s.ok = w.some(x => q.aceptadas.includes(x)); s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "acepcion") {
    if (q.opciones) {
      const c = document.querySelector(`input[name="${q.id}"]:checked`);
      if (!c) { s.msg = "Elige una acepción."; return; }
      s.sel = +c.value; s.intentos = (s.intentos || 0) + 1; s.ok = s.sel === q.correcta; s.done = s.ok || s.intentos >= 2;
    } else {
      if (!(s.texto || "").trim()) { s.msg = "Escribe algo antes de comprobar."; return; }
      s.intentos = (s.intentos || 0) + 1; s.ok = simil(s.texto, q.acepcion) >= 0.75; s.done = s.ok || s.intentos >= 3;
    }
  } else if (q.tipo === "silabas") {
    if (!(s.b || []).length) { s.msg = "Marca dónde empieza cada sílaba."; return; }
    const sol = solB(q), b = s.b;
    s.intentos = (s.intentos || 0) + 1; s.ok = sol.length === b.length && sol.every(x => b.includes(x)); s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "acentos") {
    const sel = s.sel || [];
    if (!sel.length && !s.tipo) { s.msg = "Marca alguna sílaba o elige un tipo antes de comprobar."; return; }
    const opt = q.opcionales || [];
    s.intentos = (s.intentos || 0) + 1;
    s.ok = q.tonicas.every(x => sel.includes(x)) && sel.every(x => q.tonicas.includes(x) || opt.includes(x)) && s.tipo === q.tipoCorrecto;
    s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "rima") {
    const letras = s.letras || [];
    if (!letras.some(Boolean)) { s.msg = "Asigna al menos una letra antes de comprobar."; return; }
    const idx = rimaIdx(q), n = schemeNorm(idx.map(i => (letras[i] || "").toUpperCase())), sol = q.correcta.toUpperCase();
    s.res = []; idx.forEach((i, k) => { s.res[i] = n[k] === sol[k]; });
    s.intentos = (s.intentos || 0) + 1; s.ok = rimaIdx(q).every(i => s.res[i]); s.done = s.ok || s.intentos >= 3;
  }
}
function saveOpen(q) {
  const s = st(q.id); s.msg = "";
  if (q.tipo === "abierta") {
    if (!(s.texto || "").trim()) { s.msg = "Escribe algo antes de guardar."; return; }
  } else if (q.tipo === "diccionario") {
    const it = s.items || {};
    if (q.palabras.some((_, i) => !(it[i] && (it[i].def || "").trim() && (it[i].sen || "").trim()))) { s.msg = "Completa los dos campos de cada palabra."; return; }
  } else if (q.tipo === "acepcion") {
    if (!(s.texto || "").trim()) { s.msg = "Escribe algo antes de guardar."; return; }
  } else if (q.tipo === "seleccion") {
    if (!Object.keys(s.marcadas || {}).length) { s.msg = "Marca al menos una palabra."; return; }
  } else if (q.tipo === "marcar") {
    const m = s.marcadas || {}, ks = Object.keys(m);
    if (ks.length < q.minimo) { s.msg = `Marca al menos ${q.minimo} palabras.`; return; }
    if (ks.some(k => !(m[k] || "").trim())) { s.msg = "Explica cada palabra que marcaste."; return; }
  }
  s.done = true; s.fecha = new Date().toISOString();
}

/* ---------- partes ---------- */
function renderPart() {
  const el = document.getElementById("part");
  if (S.sec === N_PARTES) { renderEntrega(el); return; }
  const p = UNIDAD.partes[S.sec];
  el.innerHTML = `<div class="part-head"><p class="eyebrow">Parte ${S.sec + 1} de ${N_PARTES}</p><h2>${esc(p.titulo)}</h2><p class="lead">${esc(p.lead)}</p></div>
    ${S.sec === 0 && UNIDAD.avisoInicial ? `<div class="aviso">${UNIDAD.avisoInicial}</div>` : ""}
    ${p.lectura ? `<div class="reading">${p.lectura}</div>` : ""}
    ${p.requiere && !isDone(QS[p.requiere])
      ? `<div class="fb info"><p>Primero decide qué palabras hay que buscar: completa la pregunta ${QS[p.requiere].n} de «${esc(UNIDAD.partes[QS[p.requiere].parte].nombre)}».</p><p><button class="btn ghost" data-act="nav" data-i="${QS[p.requiere].parte}">Ir a esa pregunta</button></p></div>`
      : p.preguntas.map(renderQ).join("")}
    <div class="next-row" id="nextRow"></div>`;
  renderNext();
}

function stats() {
  const all = Object.values(QS), auto = all.filter(q => AUTO.includes(q.tipo));
  return {
    total: all.length, hechas: all.filter(answered).length,
    auto: auto.length, primera: auto.filter(q => { const s = S.r[q.id]; return s && s.ok && s.intentos === 1; }).length,
    finalOk: auto.filter(q => { const s = S.r[q.id]; return s && s.ok; }).length
  };
}
function buildReport() {
  const t = stats(), L = [];
  L.push(`${UNIDAD.programa} · ${UNIDAD.curso} · ${UNIDAD.bloque}`);
  L.push(`Profesor: ${UNIDAD.profesor}`);
  L.push(`UNIDAD: ${UNIDAD.autor}, «${UNIDAD.titulo}»`);
  L.push(`Texto: ${UNIDAD.referenciaTexto}`);
  L.push(`Alumno: ${S.nombre.trim() || "(sin nombre)"}    Correo: ${(S.correo || "").trim() || "-"}`);
  L.push(`Fecha: ${new Date().toLocaleString("es-MX")}`);
  L.push(`Avance: ${t.hechas}/${t.total} preguntas respondidas`);
  UNIDAD.partes.forEach((p, pi) => {
    L.push("", `=== ${pi + 1}. ${p.nombre.toUpperCase()} ===`);
    p.preguntas.forEach(q => {
      const s = S.r[q.id] || {};
      L.push("", `${q.n}. ${strip(q.enunciado)}`);
      if (!answered(q)) { L.push("   (sin responder)"); return; }
      if (q.tipo === "opcion") L.push(`   → ${strip(q.opciones[s.sel])}`);
      else if (q.tipo === "silabas") L.push(`   → ${divText(VERSOS[q.verso - 1], new Set(s.b))}`);
      else if (q.tipo === "acentos") L.push(`   → sílabas ${[...s.sel].sort((x, y) => x - y).join(", ")}; ${s.tipo}`);
      else if (q.tipo === "numero") L.push(`   → ${s.val}`);
      else if (q.tipo === "rima") L.push(`   → ${fmtRima(q, schemeNorm(rimaIdx(q).map(i => ((s.letras || [])[i] || "").toUpperCase())).map(l => l || "_").join(""))}`);
      else if (q.tipo === "abierta") L.push("   " + (s.texto || "").trim().replace(/\n/g, "\n   "));
      else if (q.tipo === "diccionario") q.palabras.forEach((w, i) => { const v = (s.items || {})[i] || {}; L.push(`   · ${w.forma} (v. ${w.verso})`, `     Autoridades: ${(v.def || "").trim()}`, `     En el verso: ${(v.sen || "").trim()}`); });
      else if (q.tipo === "oposicion") L.push(`   → ${sortKeys(Object.keys(s.marcadas || {})).map(tokWord).join(", ")}`);
      else if (q.tipo === "seleccion") { const r = seleccionRes(q, s.marcadas); L.push(`   Marcó: ${sortKeys(Object.keys(s.marcadas || {})).map(tokWord).join(", ")}`, `   Encontró ${r.found.length} de ${q.terminos.length}. Faltaron: ${r.missed.map(t => t.forma).join(", ") || "ninguna"}`); }
      else if (q.tipo === "corta") L.push(`   → ${(s.texto || "").trim()}`);
      else if (q.tipo === "ordenar") L.push(`   → ${ordText(q, s.orden)}`);
      else if (q.tipo === "acepcion") L.push(`   → ${q.opciones ? q.opciones[s.sel] : (s.texto || "").trim()}`);
      else if (q.tipo === "marcar") Object.keys(s.marcadas || {}).sort((a, b) => { const [la, wa] = a.split("-").map(Number), [lb, wb] = b.split("-").map(Number); return la - lb || wa - wb; }).forEach(k => {
        const [l, w] = k.split("-").map(Number); L.push(`   · ${tokens(VERSOS[l - 1])[w].w} (v. ${l}): ${(s.marcadas[k] || "").trim()}`);
      });
    });
  });
  return L.join("\n");
}
function renderReport() { const r = document.getElementById("report"); if (r) r.value = buildReport(); const w = document.getElementById("nameWarn"); if (w) w.hidden = !!S.nombre.trim() && correoValido(S.correo); const st2 = document.getElementById("sendTo"); if (st2) st2.textContent = (S.correo || "").trim() || "tu correo"; }
function renderEntrega(el) {
  const t = stats();
  const rows = UNIDAD.partes.map((p, i) => { const d = p.preguntas.filter(answered).length, tot = p.preguntas.length;
    if (!tot) return "";
    return `<tr><td>${i + 1}. ${esc(p.nombre)}</td><td>${d}/${tot}</td><td><span class="pill ${d === tot ? "ok" : "pend"}">${d === tot ? "Completa" : "Pendiente"}</span></td></tr>`; }).join("");
  const envio = ENVIO_URL ? `
    <section class="send" aria-labelledby="sendTitle">
      <h3 id="sendTitle">Envía tus respuestas</h3>
      <p>Tu profesor recibirá el registro de tu entrega y tú recibirás una copia de tus respuestas en <strong id="sendTo">${esc((S.correo || "").trim() || "tu correo")}</strong>, para que la guardes como evidencia.</p>
      <p>Al pulsar <strong>Enviar mis respuestas</strong>, tu actividad se toma en cuenta como entregada en Classroom, aunque ahí tarde en aparecer como entregada.</p>
      <div class="row"><button class="btn" data-act="send" id="sendBtn">Enviar mis respuestas</button><span id="sendMsg" role="status">${S.enviado ? "Última entrega: " + esc(new Date(S.enviado).toLocaleString("es-MX")) + "." : ""}</span></div>
    </section>
    <h3 class="steps-title">Si quieres, guarda también una copia</h3>` : "";
  el.innerHTML = `<div class="part-head"><p class="eyebrow">Último paso</p><h2>Entrega</h2>
      <p class="lead">${ENVIO_URL ? "Cuando termines, envía tus respuestas desde aquí. Con eso tu actividad queda entregada." : "Cuando termines, copia tus respuestas y entrégalas en la tarea de Classroom. Así tu profesor sabe que completaste la actividad y puede revisar tus respuestas abiertas."}</p></div>
    <table class="summary"><thead><tr><th>Parte</th><th>Respondidas</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>
    ${UNIDAD.avisoFinal ? `<aside class="extra"><p class="extra-eyebrow">Antes de entregar</p><p>${esc(UNIDAD.avisoFinal.texto)}</p><a class="video-link" href="${esc(UNIDAD.avisoFinal.enlace)}" target="_blank" rel="noopener"><span class="doc" aria-hidden="true"></span><span><strong>${esc(UNIDAD.avisoFinal.etiqueta)}</strong><br>Se abre en Google Drive</span></a></aside>` : ""}
    <div class="fb bad" id="nameWarn" ${S.nombre.trim() && correoValido(S.correo) ? "hidden" : ""}><p>Escribe tu nombre completo y tu correo en la parte superior antes de entregar.</p></div>
    ${envio}
    ${ENVIO_URL ? `<p>Puedes copiar tus respuestas y pegarlas donde quieras; no hace falta para entregar.</p>` : `<ol class="steps">
      <li>Pulsa <strong>Copiar respuestas</strong>.</li>
      <li>En Classroom, abre la tarea y elige <strong>Añadir o crear → Documentos</strong>.</li>
      <li>Pega tus respuestas en el documento y vuelve a la tarea.</li>
      <li>Pulsa <strong>Entregar</strong>.</li>
    </ol>`}
    <div class="row"><button class="btn ${ENVIO_URL ? "ghost" : ""}" data-act="copy">Copiar respuestas</button><span id="copyMsg" role="status"></span></div>
    <textarea class="report" id="report" readonly aria-label="Tus respuestas"></textarea>
    <div class="confirm" id="resetBox"><button class="btn ghost" data-act="reset">Borrar mis respuestas y empezar de nuevo</button></div>`;
  renderReport();
}

function renderNext() {
  const el = document.getElementById("nextRow"); if (!el || S.sec >= N_PARTES) return;
  const faltan = pendientes(S.sec);
  const label = S.sec + 1 < N_PARTES ? "Siguiente: " + esc(UNIDAD.partes[S.sec + 1].nombre) : "Ir a la entrega";
  el.innerHTML = `<button class="btn ${faltan ? "ghost" : ""} next" data-act="nav" data-i="${S.sec + 1}" ${faltan ? "disabled" : ""}>${label} →</button>`
    + (faltan ? `<span class="next-msg">Para continuar, responde ${faltan === 1 ? "la pregunta que falta" : "las " + faltan + " preguntas que faltan"} en esta parte. Cualquier respuesta cuenta.</span>` : "");
}
function render() { if (!unlocked(S.sec)) S.sec = 0; renderTabs(); renderPart(); }

/* ---------- eventos ---------- */
/* arrastrar palabras (ratón y pantalla táctil) y moverlas con el teclado */
let arrastre = null;
function guardaOrden(box) { const s = st(box.dataset.q); s.orden = [...box.children].map(c => +c.dataset.i); s.msg = ""; save(); }
document.addEventListener("pointerdown", e => {
  const c = e.target.closest(".ord .chip"); if (!c || c.disabled) return;
  e.preventDefault(); c.setPointerCapture(e.pointerId); c.classList.add("drag"); arrastre = { c, box: c.parentNode };
});
document.addEventListener("pointermove", e => {
  if (!arrastre) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".chip");
  if (!el || el === arrastre.c || el.parentNode !== arrastre.box) return;
  const r = el.getBoundingClientRect(), despues = e.clientY > r.bottom || (e.clientY >= r.top && e.clientX > r.left + r.width / 2);
  arrastre.box.insertBefore(arrastre.c, despues ? el.nextSibling : el);
});
document.addEventListener("pointerup", () => {
  if (!arrastre) return;
  arrastre.c.classList.remove("drag"); guardaOrden(arrastre.box); arrastre = null;
});
document.addEventListener("keydown", e => {
  const c = e.target.closest?.(".ord .chip"); if (!c || c.disabled || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  const sib = e.key === "ArrowLeft" ? c.previousElementSibling : c.nextElementSibling; if (!sib) return;
  c.parentNode.insertBefore(c, e.key === "ArrowLeft" ? sib : sib.nextSibling); c.focus(); guardaOrden(c.parentNode);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, q = QS[b.dataset.q];
  if (act === "nav") { const to = Math.min(+b.dataset.i, N_PARTES); if (!unlocked(to)) return; S.sec = to; save(); render(); document.getElementById("part").scrollIntoView({ block: "start" }); window.scrollTo({ top: 0 }); }
  else if (act === "check") { check(q); save(); rerender(q.id); }
  else if (act === "ideas") {
    const s = st(q.id);
    if (!(s.texto || "").trim()) s.msg = "Escribe algo antes de revisar.";
    else { s.msg = ""; s.revisado = s.texto; }
    save(); rerender(q.id);
  }
  else if (act === "save") { saveOpen(q); save(); rerender(q.id); }
  else if (act === "ch") {
    const s = st(q.id), v = VERSOS[q.verso - 1]; let i = +b.dataset.i; s.msg = "";
    if (i > 0 && ["rr", "ll", "ch"].includes((v[i - 1] + v[i]).toLowerCase())) i--;
    if (i === firstL(v)) return;
    s.b = s.b || []; const k = s.b.indexOf(i); if (k >= 0) s.b.splice(k, 1); else s.b.push(i);
    save(); rerender(q.id);
  }
  else if (act === "acc") {
    const s = st(q.id), i = +b.dataset.i; s.msg = ""; s.sel = s.sel || [];
    const k = s.sel.indexOf(i); if (k >= 0) s.sel.splice(k, 1); else s.sel.push(i);
    save(); rerender(q.id);
  }
  else if (act === "tok") {
    const s = st(q.id); s.marcadas = s.marcadas || {}; s.msg = "";
    if (b.dataset.k in s.marcadas) delete s.marcadas[b.dataset.k]; else s.marcadas[b.dataset.k] = "";
    save(); rerender(q.id);
  }
  else if (act === "send") {
    const msg = document.getElementById("sendMsg");
    if (!S.nombre.trim()) { msg.textContent = "Escribe tu nombre completo en la parte superior."; nombre.focus(); return; }
    if (!correoValido(S.correo)) { msg.textContent = "Revisa tu correo en la parte superior: debe tener la forma nombre@dominio.com, sin espacios ni acentos."; correo.focus(); return; }
    const t = stats();
    b.disabled = true; msg.textContent = "Enviando…";
    fetch(ENVIO_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ unidad: UNIDAD.id, titulo: `${UNIDAD.autor}, «${UNIDAD.titulo}»`, curso: `${UNIDAD.curso} · ${UNIDAD.bloque}`, nombre: S.nombre.trim(), correo: S.correo.trim(), avance: `${t.hechas}/${t.total}`, informe: buildReport() }) })
      .then(r => r.text())
      .then(txt => {
        let d; try { d = JSON.parse(txt); } catch (e) { throw new Error("servicio"); }
        if (!d.ok) throw new Error(d.error === "correo" ? "correo" : "servidor");
        S.enviado = new Date().toISOString(); save();
        msg.textContent = `Enviado: tu actividad cuenta como entregada. Revisa tu correo (${S.correo.trim()}); si no lo ves en unos minutos, busca también en la carpeta de spam.`;
      })
      .catch(err => {
        msg.textContent = err.message === "correo" ? "El servicio no aceptó tu correo. Revisa que esté bien escrito, sin espacios ni acentos."
          : err.message === "servicio" ? "El servicio de envío no está disponible en este momento. Copia tus respuestas y entrégalas en Classroom, y avisa a tu profesor."
          : "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo; si sigue fallando, copia tus respuestas y entrégalas en Classroom.";
      })
      .finally(() => { b.disabled = false; });
  }
  else if (act === "copy") {
    const r = document.getElementById("report"), msg = document.getElementById("copyMsg");
    r.value = buildReport();
    const fallback = () => { r.focus(); r.select(); msg.textContent = "Texto seleccionado: cópialo con Ctrl+C (o Cmd+C)."; };
    try { navigator.clipboard.writeText(r.value).then(() => { msg.textContent = "Copiado. Ahora pégalo en el documento de Classroom."; }, fallback); } catch (err) { fallback(); }
  }
  else if (act === "reset") {
    document.getElementById("resetBox").innerHTML = `<span>¿Seguro? Se borrarán todas tus respuestas en este navegador.</span><button class="btn danger" data-act="reset-yes">Sí, borrar</button><button class="btn ghost" data-act="nav" data-i="${N_PARTES}">Cancelar</button>`;
  }
  else if (act === "reset-yes") { S = { nombre: S.nombre, correo: S.correo, r: {}, sec: 0 }; save(); render(); }
});
document.addEventListener("input", e => {
  const t = e.target, id = t.dataset.q; if (!id || t.readOnly) return;
  const s = st(id), f = t.dataset.f;
  if (f === "texto") s.texto = t.value;
  else if (f === "def" || f === "sen") { s.items = s.items || {}; (s.items[t.dataset.i] = s.items[t.dataset.i] || {})[f] = t.value; }
  else if (f === "nota") { s.marcadas[t.dataset.k] = t.value; }
  save();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.tipo) { st(t.dataset.tipo).tipo = t.value; save(); }
  if (t.dataset.rima) { const s = st(t.dataset.rima); s.letras = s.letras || []; s.letras[+t.dataset.i] = t.value; save(); }
});

render();
</script>
